[package]
name = "nord"
version = "1.0.0-alpha.1"
edition.workspace = true
license.workspace = true
publish = false

[workspace]
resolver = "3"
default-members = ["."]
members = [
    ".",
    "crates/nord_app",
    "crates/nord_dependency",
    "crates/nord_events",
    "crates/nord_inputs",
    "crates/nord_crash",
    "crates/nord_diagnostics",
    "crates/nord_memory",
    "crates/nord_hash",
    "crates/nord_time",
    "crates/nord_config",
    "crates/nord_threading",
    "crates/nord_jobs",
    "crates/nord_scheduler",
    "crates/nord_log",
    "crates/nord_render",
    "crates/nord_world",
    "crates/nord_generation",
    "crates/nord_physics",
    "crates/nord_platform",
    "crates/nord_math",
    "crates/nord_camera",
    "crates/nord_mesh",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
ctrlc = "3.5.2"
nord_app = { path = "crates/nord_app" }
nord_camera = { path = "crates/nord_camera" }
nord_mesh = { path = "crates/nord_mesh" }
serde = { version = "1.0", features = ["derive"] }

[profile.dev]
opt-level = 0
debug = "full"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
strip = "none"
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"

[lints]
workspace = true
