[application]
title = "Nord"

[window]
width = 1280
height = 720
resizable = true

[memory]
# Optional cap for explicitly tracked game-owned CPU buffers; omit for no cap.

[threading]
# Omit this value to reserve one logical processor for the application thread.
# worker_threads = 7

[world]
chunks_above_origin = 2
chunks_below_origin = 64

[timing]
max_frame_delta_ms = 250
fixed_step_ns = 16666667
max_steps_per_frame = 8
time_scale = 1.0
